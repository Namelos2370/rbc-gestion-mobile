<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBC Gestion - Phase 2 Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .dark { color-scheme: dark; }
        .dark body { @apply bg-slate-900 text-slate-100; }
    </style>
</head>
<body class="dark bg-slate-900 text-slate-100">
    <div id="app"></div>

    <script>
        const SUPABASE_URL = 'https://vawnhnstinsbgfosjoag.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhd25obnN0aW5zYmdmb3Nqb2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk2MTgzMjcsImV4cCI6MTk5NTIxODMyN30.example';

        let authToken = localStorage.getItem('auth_token');
        let profile = null;
        let invoices = [];
        let selectedInvoices = new Set();
        let activeTab = 'dashboard';
        let editingInvoice = null;

        // Render app
        function render() {
            const app = document.getElementById('app');

            if (!authToken) {
                app.innerHTML = renderLogin();
                document.querySelector('form')?.addEventListener('submit', handleLogin);
                return;
            }

            if (!profile) {
                app.innerHTML = '<div class="flex items-center justify-center h-screen"><p>Loading...</p></div>';
                return;
            }

            app.innerHTML = renderApp();
            attachEventListeners();
        }

        function renderLogin() {
            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">
                    <div class="bg-slate-800 border border-slate-700 rounded-lg p-6 w-full max-w-sm shadow-2xl">
                        <h1 class="text-3xl font-bold text-blue-400 mb-6 text-center">RBC Gestion</h1>
                        <form class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Email</label>
                                <input name="email" type="email" value="super@rbc.local"
                                    class="w-full bg-slate-700 border border-slate-600 rounded px-4 py-2 text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Password</label>
                                <input name="password" type="password" value="password123"
                                    class="w-full bg-slate-700 border border-slate-600 rounded px-4 py-2 text-white">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 rounded px-4 py-2 font-medium transition">
                                Se connecter
                            </button>
                        </form>
                        <p class="text-xs text-slate-400 mt-6 text-center">Phase 2 - Batch Proforma + Post-Validation Editing</p>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            return `
                <div class="min-h-screen bg-slate-900">
                    <!-- Header -->
                    <div class="bg-slate-800 border-b border-slate-700 sticky top-0 z-10">
                        <div class="p-4 flex items-center justify-between">
                            <div>
                                <h1 class="text-xl font-bold text-blue-400">RBC Gestion</h1>
                                <p class="text-xs text-slate-400">${profile?.role}</p>
                            </div>
                            <button id="logout-btn" class="bg-red-600 px-3 py-1 rounded text-sm">Déconnexion</button>
                        </div>

                        <!-- Tabs -->
                        <div class="flex border-t border-slate-700 overflow-x-auto">
                            <button class="tab-btn flex-1 px-4 py-3 text-sm font-medium transition ${activeTab === 'dashboard' ? 'border-b-2 border-blue-600 text-blue-400' : 'text-slate-400'}" data-tab="dashboard">
                                Tableau
                            </button>
                            <button class="tab-btn flex-1 px-4 py-3 text-sm font-medium transition ${activeTab === 'creation' ? 'border-b-2 border-blue-600 text-blue-400' : 'text-slate-400'}" data-tab="creation">
                                Créer
                            </button>
                            <button class="tab-btn flex-1 px-4 py-3 text-sm font-medium transition ${activeTab === 'validation' ? 'border-b-2 border-blue-600 text-blue-400' : 'text-slate-400'}" data-tab="validation">
                                Valider
                            </button>
                            ${profile?.role === 'super_admin' ? `
                                <button class="tab-btn flex-1 px-4 py-3 text-sm font-medium transition ${activeTab === 'batch' ? 'border-b-2 border-blue-600 text-blue-400' : 'text-slate-400'}" data-tab="batch">
                                    📦 Batch
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="p-4 pb-20">
                        ${renderTabContent()}
                    </div>
                </div>

                ${editingInvoice ? renderEditModal() : ''}
            `;
        }

        function renderTabContent() {
            switch(activeTab) {
                case 'dashboard':
                    return `
                        <div class="space-y-4">
                            <h2 class="text-2xl font-bold mb-4">Tableau de bord</h2>
                            <div class="grid gap-4">
                                <div class="bg-slate-800 border border-slate-700 rounded-lg p-4">
                                    <p class="text-slate-400 text-sm">Total factures</p>
                                    <p class="text-3xl font-bold mt-2">${invoices.length}</p>
                                </div>
                                <div class="bg-slate-800 border border-slate-700 rounded-lg p-4">
                                    <p class="text-slate-400 text-sm">Brouillons</p>
                                    <p class="text-3xl font-bold mt-2">${invoices.filter(i => i.status === 'draft').length}</p>
                                </div>
                                <div class="bg-slate-800 border border-slate-700 rounded-lg p-4">
                                    <p class="text-slate-400 text-sm">Validées</p>
                                    <p class="text-3xl font-bold text-green-400 mt-2">${invoices.filter(i => i.status === 'validated').length}</p>
                                </div>
                            </div>
                        </div>
                    `;

                case 'creation':
                    return `
                        <div>
                            <h2 class="text-2xl font-bold mb-4">Créer une facture</h2>
                            <form id="create-form" class="bg-slate-800 border border-slate-700 rounded-lg p-4 space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-2">Client</label>
                                    <input type="text" name="client_name" required
                                        class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-2">Service</label>
                                    <input type="text" name="service_description" required
                                        class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-2">Montant</label>
                                    <input type="number" name="total_amount" step="0.01" required
                                        class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 rounded px-4 py-2 font-medium transition">
                                    Créer facture
                                </button>
                            </form>
                        </div>
                    `;

                case 'validation':
                    return `
                        <div>
                            <h2 class="text-2xl font-bold mb-4">Valider les factures</h2>
                            <div class="space-y-3">
                                ${invoices.filter(i => i.status === 'draft').map(inv => `
                                    <div class="bg-slate-800 border border-slate-700 rounded-lg p-4">
                                        <p class="font-bold">${inv.client_name}</p>
                                        <p class="text-slate-400 text-sm">${inv.service_description} - $${inv.total_amount}</p>
                                        <div class="flex gap-2 mt-3">
                                            <button class="validate-btn flex-1 bg-green-600 px-3 py-2 rounded text-sm" data-id="${inv.id}">Valider</button>
                                            <button class="delete-btn flex-1 bg-red-600 px-3 py-2 rounded text-sm" data-id="${inv.id}">Supprimer</button>
                                        </div>
                                    </div>
                                `).join('')}
                                ${invoices.filter(i => i.status === 'validated').length > 0 ? `
                                    <h3 class="text-lg font-bold mt-6 mb-3">Factures validées</h3>
                                    ${invoices.filter(i => i.status === 'validated').map(inv => `
                                        <div class="bg-slate-800 border border-green-700 rounded-lg p-4">
                                            <p class="font-bold">${inv.client_name}</p>
                                            <p class="text-slate-400 text-sm">${inv.service_description} - $${inv.total_amount}</p>
                                            ${inv.batch_id ? '<p class="text-xs text-blue-400 mt-2">🔗 Dans un batch</p>' : ''}
                                            <button class="edit-btn w-full bg-blue-600 px-3 py-2 rounded text-sm mt-3" data-id="${inv.id}">Modifier</button>
                                        </div>
                                    `).join('')}
                                ` : ''}
                            </div>
                        </div>
                    `;

                case 'batch':
                    return `
                        <div>
                            <h2 class="text-2xl font-bold mb-4">📦 Batch Proforma</h2>
                            <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 space-y-4">
                                <p class="text-slate-400">${selectedInvoices.size} facture(s) sélectionnée(s)</p>
                                <div class="flex gap-2">
                                    <button id="select-all" class="flex-1 bg-slate-700 px-3 py-2 rounded text-sm">Sélectionner tout</button>
                                    <button id="deselect-all" class="flex-1 bg-slate-700 px-3 py-2 rounded text-sm">Désélectionner</button>
                                </div>
                                <div class="space-y-2 max-h-64 overflow-y-auto">
                                    ${invoices.filter(i => i.status === 'draft').map(inv => `
                                        <label class="flex items-center gap-3 p-3 bg-slate-700 rounded cursor-pointer hover:bg-slate-600">
                                            <input type="checkbox" class="invoice-check" value="${inv.id}" ${selectedInvoices.has(inv.id) ? 'checked' : ''}>
                                            <div class="flex-1">
                                                <p class="font-medium text-sm">${inv.client_name}</p>
                                                <p class="text-xs text-slate-400">${inv.service_description} - $${inv.total_amount}</p>
                                            </div>
                                        </label>
                                    `).join('')}
                                </div>
                                <button id="generate-batch" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 px-4 py-2 rounded font-medium transition">
                                    Générer Batch Proforma
                                </button>
                            </div>
                        </div>
                    `;
            }
        }

        function renderEditModal() {
            return `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div class="bg-slate-800 rounded-lg p-6 w-full max-w-sm border border-slate-700">
                        <h2 class="text-xl font-bold mb-4">Modifier la facture</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Client</label>
                                <input id="edit-client" type="text" value="${editingInvoice?.client_name || ''}"
                                    class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Notes</label>
                                <textarea id="edit-notes" rows="3"
                                    class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white">${editingInvoice?.notes || ''}</textarea>
                            </div>
                        </div>
                        <div class="mt-6 flex gap-3">
                            <button id="modal-cancel" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded font-medium transition">Annuler</button>
                            <button id="modal-save" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium transition">Enregistrer</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    activeTab = e.target.dataset.tab;
                    render();
                });
            });

            // Logout
            document.getElementById('logout-btn')?.addEventListener('click', () => {
                localStorage.removeItem('auth_token');
                authToken = null;
                profile = null;
                render();
            });

            // Create invoice
            document.getElementById('create-form')?.addEventListener('submit', handleCreateInvoice);

            // Validate invoice
            document.querySelectorAll('.validate-btn').forEach(btn => {
                btn.addEventListener('click', (e) => validateInvoice(e.target.dataset.id));
            });

            // Delete invoice
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => deleteInvoice(e.target.dataset.id));
            });

            // Edit invoice
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    editingInvoice = invoices.find(i => i.id === id);
                    render();
                });
            });

            // Batch
            document.querySelectorAll('.invoice-check').forEach(check => {
                check.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        selectedInvoices.add(e.target.value);
                    } else {
                        selectedInvoices.delete(e.target.value);
                    }
                    render();
                });
            });

            document.getElementById('select-all')?.addEventListener('click', () => {
                invoices.filter(i => i.status === 'draft').forEach(i => selectedInvoices.add(i.id));
                render();
            });

            document.getElementById('deselect-all')?.addEventListener('click', () => {
                selectedInvoices.clear();
                render();
            });

            document.getElementById('generate-batch')?.addEventListener('click', generateBatchProforma);

            // Modal
            document.getElementById('modal-cancel')?.addEventListener('click', () => {
                editingInvoice = null;
                render();
            });

            document.getElementById('modal-save')?.addEventListener('click', saveInvoiceEdit);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    authToken = data.access_token;
                    localStorage.setItem('auth_token', authToken);
                    loadProfile();
                } else {
                    alert('Login failed');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: { 'Authorization': `Bearer ${authToken}`, 'apikey': SUPABASE_KEY }
                });
                const user = await res.json();

                const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${user.id}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` }
                });
                const profiles = await profileRes.json();
                profile = { id: user.id, ...profiles[0] };

                loadInvoices();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function loadInvoices() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices?order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` }
                });
                invoices = await res.json();
                render();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        async function handleCreateInvoice(e) {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({
                        client_name: formData.get('client_name'),
                        service_description: formData.get('service_description'),
                        total_amount: formData.get('total_amount'),
                        status: 'draft',
                        created_by: profile.id
                    })
                });
                if (res.ok) {
                    loadInvoices();
                    activeTab = 'validation';
                } else {
                    alert('Error creating invoice');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function validateInvoice(id) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ status: 'validated' })
                });
                if (res.ok) loadInvoices();
                else alert('Error validating invoice');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deleteInvoice(id) {
            if (!confirm('Supprimer cette facture?')) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` }
                });
                if (res.ok) loadInvoices();
                else alert('Error deleting invoice');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function generateBatchProforma() {
            if (selectedInvoices.size === 0) {
                alert('Sélectionnez au moins une facture');
                return;
            }

            try {
                const batchName = `Batch_${new Date().toISOString().slice(0,10)}_${Date.now()}`;
                const selectedIds = Array.from(selectedInvoices);

                const batchRes = await fetch(`${SUPABASE_URL}/rest/v1/proforma_batches`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({
                        created_by: profile.id,
                        invoice_ids: selectedIds,
                        batch_name: batchName,
                        status: 'draft'
                    })
                });

                const batch = await batchRes.json();

                for (const invoiceId of selectedIds) {
                    await fetch(`${SUPABASE_URL}/rest/v1/invoices?id=eq.${invoiceId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` },
                        body: JSON.stringify({ batch_id: batch[0].id, invoice_type: 'proforma' })
                    });
                }

                alert(`✅ Batch créé: ${batchName}\n${selectedIds.length} factures liées`);
                selectedInvoices.clear();
                loadInvoices();
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        }

        async function saveInvoiceEdit() {
            const clientName = document.getElementById('edit-client').value;
            const notes = document.getElementById('edit-notes').value;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices?id=eq.${editingInvoice.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({
                        client_name: clientName,
                        notes: notes,
                        edited_at: new Date().toISOString(),
                        edited_by: profile.id
                    })
                });

                if (res.ok) {
                    editingInvoice = null;
                    loadInvoices();
                } else {
                    alert('Error saving invoice');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // Initial render
        render();
        if (authToken) loadProfile();
    </script>
</body>
</html>
